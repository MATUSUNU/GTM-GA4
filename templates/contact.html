{% extends "base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="w3-container w3-padding">
  <h1>Contact Us</h1>
  <form method="post" id="contact_form" data-form-location="contact-page">
    {% csrf_token %}
    {{ form }}
    <div class="form-actions">
      <button type="submit">Send</button>
    </div>
  </form>
</div>
{% endblock %}

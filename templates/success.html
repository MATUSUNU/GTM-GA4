{% extends "base.html" %}

{% block title %}Success{% endblock %}

{% block content %}

<script>
  // Check if we already fired the lead event in this browser session
  if (!sessionStorage.getItem('lead_fired')) {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      'event': 'generate_lead',
      'form_id': 'contact_form',
      'form_location': 'sidebar' // (Or use a generic value)
    });
    // Set the flag so it never fires again on refresh
    sessionStorage.setItem('lead_fired', 'true');
  }
</script>

<div class="w3-container w3-padding">
  <h1>Success</h1>
  <p>Your message was sent successfully.</p>
</div>
{% endblock %}
